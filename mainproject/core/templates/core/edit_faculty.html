{% extends 'base.html' %}

{% block title %}Edit Faculty Info | IntelliGrade{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="flex items-center gap-2">
        <a href="{% url 'faculty_list' %}" class="text-xs font-semibold theme-text-muted hover:theme-text-primary transition-colors flex items-center gap-1">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Back to Faculty Roster
        </a>
    </div>

    <div class="glass-card p-8 rounded-2xl space-y-6 shadow-xl">
        <div class="border-b border-slate-200 dark:border-slate-800 pb-4">
            <h1 class="text-xl font-bold theme-text-primary">Edit Faculty Profile</h1>
            <p class="theme-text-muted text-xs mt-1">Update profile info for Employee ID / Username: <span class="font-mono text-brand-500 font-bold">{{ target_user.username }}</span></p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider theme-text-muted mb-1.5">Full Name</label>
                <input type="text" name="full_name" value="{{ target_user.get_full_name|default:target_user.username }}" required class="w-full px-4 py-2.5 rounded-xl bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 text-sm theme-text-primary focus:outline-none focus:border-brand-500">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider theme-text-muted mb-1.5">Email Address</label>
                <input type="email" name="email" value="{{ target_user.email }}" required class="w-full px-4 py-2.5 rounded-xl bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 text-sm theme-text-primary focus:outline-none focus:border-brand-500">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider theme-text-muted mb-1.5">Department</label>
                <select name="department" required class="w-full px-4 py-2.5 rounded-xl bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 text-sm theme-text-primary focus:outline-none focus:border-brand-500">
                    {% for dept in departments %}
                    <option value="{{ dept.code }}" {% if profile.department and profile.department.code == dept.code %}selected{% endif %}>{{ dept.name }} ({{ dept.code }})</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider theme-text-muted mb-1.5">New Password (Leave blank to keep current)</label>
                <input type="password" name="password" placeholder="Enter new password to reset" class="w-full px-4 py-2.5 rounded-xl bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 text-sm theme-text-primary focus:outline-none focus:border-brand-500">
            </div>

            <div class="pt-4 flex items-center justify-end gap-3">
                <a href="{% url 'faculty_list' %}" class="px-5 py-2.5 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 theme-text-primary text-xs font-bold rounded-xl transition-all">Cancel</a>
                <button type="submit" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-brand-600/25 transition-all">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
