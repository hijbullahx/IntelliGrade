{% extends 'base.html' %}

{% block title %}Add New Course | IntelliGrade{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="flex items-center gap-2">
        <a href="{% url 'courses_list' %}" class="text-xs font-semibold theme-text-muted hover:theme-text-primary transition-colors flex items-center gap-1">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Back to Course Catalog
        </a>
    </div>

    <div class="glass-card p-8 rounded-2xl space-y-6 shadow-xl">
        <div class="border-b border-slate-200 dark:border-slate-800 pb-4">
            <h1 class="text-xl font-bold theme-text-primary">Add New Course</h1>
            <p class="theme-text-muted text-xs mt-1">Register a new academic course module under a department.</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
            
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider theme-text-muted mb-1.5">Course Title</label>
                <input type="text" name="title" value="" placeholder="e.g. Software Engineering & Architecture" required class="w-full px-4 py-2.5 rounded-xl bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 text-sm theme-text-primary focus:outline-none focus:border-brand-500">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider theme-text-muted mb-1.5">Course Code</label>
                <input type="text" name="code" value="" placeholder="e.g. CSE 411" required class="w-full px-4 py-2.5 rounded-xl bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 text-sm theme-text-primary focus:outline-none focus:border-brand-500 font-mono">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider theme-text-muted mb-1.5">Department</label>
                <select name="department" required class="w-full px-4 py-2.5 rounded-xl bg-slate-100/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 text-sm theme-text-primary focus:outline-none focus:border-brand-500">
                    {% for dept in departments %}
                    <option value="{{ dept.code }}">{{ dept.name }} ({{ dept.code }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="pt-4 flex items-center justify-end gap-3">
                <a href="{% url 'courses_list' %}" class="px-5 py-2.5 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 theme-text-primary text-xs font-bold rounded-xl transition-all">Cancel</a>
                <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-indigo-600/25 transition-all">Add Course</button>
            </div>
        </form>
    </div>
</div>

<script>
if (document.querySelector('form')) {
    document.querySelector('form').addEventListener('submit', function() {
        try {
            localStorage.setItem('intelligrade_entity_added', JSON.stringify({ type: 'course', time: Date.now() }));
        } catch(e){}
    });
}
</script>
{% endblock %}
