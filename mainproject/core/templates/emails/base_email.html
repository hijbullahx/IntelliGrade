<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IntelliGrade Institutional Notification{% endblock %}</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .email-card { max-width: 600px; margin: 0 auto; background-color: #1e293b; border-radius: 16px; border: 1px solid #334155; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .email-header { background: linear-gradient(135deg, #1e1b4b, #312e81, #0284c7); padding: 24px 32px; text-align: center; border-bottom: 1px solid #4338ca; }
        .email-header h1 { margin: 0; font-size: 22px; font-weight: 800; color: #ffffff; letter-spacing: -0.5px; }
        .email-header p { margin: 4px 0 0; font-size: 12px; color: #c7d2fe; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .email-body { padding: 32px; font-size: 14px; line-height: 1.6; color: #cbd5e1; }
        .email-footer { background-color: #0f172a; padding: 20px 32px; text-align: center; font-size: 11px; color: #64748b; border-top: 1px solid #334155; }
        .btn-primary { display: inline-block; padding: 12px 24px; background: linear-gradient(90deg, #0284c7, #2563eb); color: #ffffff; font-weight: 700; text-decoration: none; border-radius: 10px; margin-top: 16px; font-size: 13px; }
        .otp-box { font-size: 32px; font-weight: 800; letter-spacing: 6px; color: #38bdf8; background-color: #0f172a; padding: 16px 24px; border-radius: 12px; border: 1px solid #0284c7; display: inline-block; margin: 16px 0; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; }
        .badge-success { background-color: #065f46; color: #6ee7b7; }
        .badge-info { background-color: #075985; color: #7dd3fc; }
    </style>
</head>
<body>
    <div class="email-card">
        <div class="email-header">
            <h1>INTELLIGRADE</h1>
            <p>IUBAT Institutional AI Evaluation & OBE Platform</p>
        </div>
        <div class="email-body">
            {% block content %}{% endblock %}
        </div>
        <div class="email-footer">
            <p>&copy; 2026 IntelliGrade AI Systems. Official Sender: <strong>intelligrade@dsr.iubat.ac.bd</strong></p>
            <p>International University of Business Agriculture and Technology (IUBAT)</p>
        </div>
    </div>
</body>
</html>
